version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [hugeParam]
  exclusions:
    presets:
      - std-error-handling # unchecked Close/Flush/print are fine
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [errcheck, unparam, bodyclose, revive]
      - path: cmd/
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [iotanalytics]
